name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Show tool versions
        run: |
          node --version
          npm --version
          python3 --version

      - name: Run unit tests
        run: npm test

      - name: Run full project gate
        run: npm run check
