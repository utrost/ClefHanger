name: Native prototype

on:
  push:
    branches: [feat/flutter-rust-port]
    paths: [native/**, .github/workflows/native.yml]
  pull_request:
    paths: [native/**, .github/workflows/native.yml]

jobs:
  native:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned toolchain
        run: cat native/tools/toolchain.env >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/core -> target
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          cmdline-tools-version: '12266719'
          log-accepted-android-sdk-licenses: false
      - name: Install Android Rust build helper
        run: |
          sdkmanager "ndk;$NDK_VERSION" "build-tools;36.0.0" "platforms;android-36"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - name: Prepare Android and Rust libraries
        run: native/tools/prepare_android.sh
      - name: Format, lint and test Rust
        run: |
          cargo fmt --manifest-path native/core/Cargo.toml --check
          cargo clippy --manifest-path native/core/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path native/core/Cargo.toml
          cargo build --manifest-path native/core/Cargo.toml --release
      - name: Test Flutter and real host FFI
        working-directory: native/app
        env:
          CLEFHANGER_NATIVE_TESTS: '1'
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/core/target/release
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Build debug Android APK
        working-directory: native/app
        run: flutter build apk --debug --target-platform android-arm64,android-x64
      - name: Check packaged Rust ABIs
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          apk = 'native/app/build/app/outputs/flutter-apk/app-debug.apk'
          with ZipFile(apk) as package:
              names = set(package.namelist())
          for abi in ('arm64-v8a', 'x86_64'):
              assert f'lib/{abi}/libclefhanger_core.so' in names
          print('Rust libraries included for both Android ABIs')
          PY
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: clefhanger-android-debug
          path: native/app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
