name: Native store candidate

on:
  workflow_dispatch:
  push:
    branches: [feat/flutter-rust-port]
    paths: [native/**, tools/**, .github/workflows/native-store.yml]
  pull_request:
    paths: [native/**, tools/**, .github/workflows/native-store.yml]

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned toolchain
        run: cat native/tools/toolchain.env >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy, rustfmt
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: native/core -> target
      - name: Install Android Rust build helper
        run: |
          sdkmanager "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
          cargo install cargo-ndk --version "$CARGO_NDK_VERSION" --locked
      - name: Prepare Android and Rust libraries
        run: native/tools/prepare_android.sh
      - name: Format, lint and test Rust
        run: |
          cargo fmt --manifest-path native/core/Cargo.toml --check
          cargo clippy --manifest-path native/core/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path native/core/Cargo.toml
          cargo build --manifest-path native/core/Cargo.toml --release
      - name: Test Flutter and real host FFI
        working-directory: native/app
        env:
          CLEFHANGER_NATIVE_TESTS: '1'
          LD_LIBRARY_PATH: ${{ github.workspace }}/native/core/target/release
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze
          flutter test
      - name: Test packaging checks
        run: python3 -m unittest discover -s tools/tests -v
      - name: Build unsigned store candidates
        working-directory: native/app
        run: |
          flutter build apk --release --target-platform android-arm64,android-x64 --build-number "$((100000 + GITHUB_RUN_NUMBER))"
          flutter build appbundle --release --target-platform android-arm64,android-x64 --build-number "$((100000 + GITHUB_RUN_NUMBER))"
      - name: Verify store candidates
        run: |
          python3 tools/verify_store_build.py native/app/build/app/outputs/flutter-apk/app-release.apk --build-tools "$ANDROID_HOME/build-tools/36.0.0"
          python3 tools/verify_store_build.py native/app/build/app/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-native-store-candidate
          path: |
            native/app/build/app/outputs/flutter-apk/app-release.apk
            native/app/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
