Summary: Learn to read music by singing and playing notes
Description: |-
  Practise staff notation with microphone feedback, reference tones, touch
  answers and timed challenges. Progress is stored locally. No account needed.
MaintainerNotes: |-
  Flutter application in native/app with Rust libraries built from native/core.
  Native audio and microphone use Android framework APIs, without Google Play
  services or Firebase. Pin toolchains using native/tools/toolchain.env.
  Release builds are unsigned by default; no upstream private key is required.
  Before enabling, validate a tagged recipe
  with fdroidserver, including toolchain provisioning and dependency scans.
  Build entry point: native/tools/prepare_android.sh. Release output:
  native/app/build/app/outputs/flutter-apk/app-release.apk.
  See native/docs/distribution.md for signing and submission requirements.
